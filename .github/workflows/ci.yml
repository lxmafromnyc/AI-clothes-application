# Fynd — the offline test suites, on every pull request into main and
# every push to main.
#
# Both jobs run scripts/ci-tests.js, which names every suite it runs.
# Each suite is offline: it stubs its own network, scripts/ci-offline.js
# refuses any connection off the runner, and each suite starts with a
# clean environment. This file references no secret, so no step can
# reach a key: nothing here calls a paid API or spends a provider
# credit. The live checks are live-validation.yml's, run by hand.
#
# node      the suites that need no browser (ffmpeg for test-demo-film)
# browser   the interface, end-to-end and browser-path suites, in
#           Playwright's Chromium
#
# A suite fails its job when it exits non-zero, prints no count, fails
# or skips a test, or tries to reach the network.
#
# test-catalog-prices is not a required check: it already fails one
# test on main (NOT_RUN in scripts/ci-tests.js says which, and why).
# The browser job still runs it, last, in a step that cannot fail the
# job, and reports the result as a warning.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Offline tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install ffmpeg
        # test-demo-film unpacks the recorded session with it to draw a
        # frame; the runner image does not carry it
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Run the Node suites
        run: node scripts/ci-tests.js node

  browser:
    name: Offline tests (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the browser suites
        run: node scripts/ci-tests.js browser
      - name: Known failing, not a required check — test-catalog-prices
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/ci-tests.js known-failing

  real-chrome:
    name: Extension in a real Chrome (toolbar click)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Install a virtual display and real X11 input
        # test-fit-panel-real-chrome runs Chromium headed on Xvfb and clicks
        # the extension's toolbar button with XTEST (python-xlib), finding
        # it on a screenshot (ImageMagick's import, Pillow)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends xvfb imagemagick python3-xlib python3-pil
      - name: Run the real-Chrome suite
        env:
          FYND_SHOTS: ${{ runner.temp }}/fynd-shots
        run: mkdir -p "$FYND_SHOTS" && node scripts/ci-tests.js real-chrome
      - name: Keep its screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fit-panel-real-chrome-screenshots
          path: ${{ runner.temp }}/fynd-shots
          if-no-files-found: ignore
